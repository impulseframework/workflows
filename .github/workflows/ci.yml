# The checks of this repository's own pull requests. The reusable workflows here are called by
# every repository of the organization, so a mistake in one of them breaks every caller's
# checks at once: actionlint reads each workflow file (the expression syntax, the inputs and
# outputs a job names, the action pins, and the shell of every run step through shellcheck)
# and fails the pull request on the first one it cannot accept. The semantic-title check
# runs by local path, which also proves that the reusable workflow can be called at all.
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened] # these are the defaults - synchronize means 'commits pushed to PR'
  push:
    branches: [master]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The actionlint release that reads the workflows; a fixed version so a new rule in a
      # later release cannot fail an unchanged pull request. shellcheck comes with the runner.
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Lint the workflows
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color
  semantic-titles:
    # A called workflow gets no more than its caller grants, and this file grants nothing
    # at the top: the title check reads the pull request.
    permissions:
      pull-requests: read
    uses: ./.github/workflows/semantic-pull-request-title.yml
